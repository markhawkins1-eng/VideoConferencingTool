# Production stack: app (Python) + Caddy (automatic HTTPS) + coturn (TURN/STUN).
# Usage: cp .env.example .env && edit && docker compose up -d --build
# See docs/DEPLOYMENT.md.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8443"
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY: "1"            # only Caddy can reach the app (no published ports)
      STUN_URLS: stun:${DOMAIN}:3478
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp,turns:${DOMAIN}:5349?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
    expose:
      - "8443"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    depends_on: [caddy]          # reuses Caddy's TLS certificate for turns:5349
    # TURN needs a wide UDP port range; host networking avoids publishing it through Docker's proxy.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/certs:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP in .env}
      - --cert=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt
      - --pkey=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.key

volumes:
  caddy_data:
  caddy_config:
