# Weekly dependency update PRs. CI runs the full test suite on each one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm: { patterns: ["*"] }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly, day: monday }
